<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Pawsome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
<a class="logo" href="index.html">Paw<span>some.</span> 🐾</a>
<a href="index.html">← Back to home</a>
</nav>

<div class="login-wrapper container">

<div class="login-visual">
<span class="eyebrow">Welcome to our pack</span>
<h2 style="font-size:35px;font-family:'Playfair Display',serif;margin-top:20px">Your pet's happy place starts here.</h2>
<img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=80" alt="Happy dog">
<p>Join the Pawsome family for little moments, big smiles and better pet care.</p>
</div>

<div class="login-form">
<h1 id="authTitle">Welcome back!</h1>
<p>Enter your details to continue.</p>

<div class="tab-buttons">
<button id="loginTab" class="active">Login</button>
<button id="signupTab">Sign up</button>
</div>

<form id="authForm">

<div class="form-group signup-field" style="display:none">
<label>Full name</label>
<input type="text" placeholder="Your name" minlength="2">
</div>

<div class="form-group">
<label>Email address</label>
<input type="email" placeholder="you@example.com" required>
</div>

<div class="form-group">
<label>Password</label>
<div class="password-row">
<input type="password" placeholder="Enter password" minlength="6" required>
<button type="button" class="toggle-password">Show</button>
</div>
</div>

<div class="form-group signup-field" style="display:none">
<label>Confirm password</label>
<input type="password" placeholder="Confirm your password" minlength="6">
</div>

<div style="margin:15px 0">
<label><input type="checkbox"> Remember me</label>
</div>

<button type="submit" class="btn btn-green full-btn" id="authSubmit">Login</button>
<div class="message" id="authMessage"></div>

</form>

<p style="margin-top:20px;text-align:center;font-size:13px">
By continuing, you agree to our demo website terms.
</p>
</div>
</div>

<footer class="footer">
<div class="footer-bottom">© <span class="year"></span> Pawsome</div>
</footer>

<script src="script.js"></script>
</body>
</html>
